name: Build and test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build downloads the SDK packages it needs once the licences are accepted.
      - name: Accept Android SDK licences
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      # Optional private signing key. Without these secrets the public development key in
      # keystore/ is used.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AICC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aicc.keystore"
            echo "AICC_KEYSTORE_FILE=$RUNNER_TEMP/aicc.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build APK
        env:
          AICC_KEYSTORE_PASSWORD: ${{ secrets.AICC_KEYSTORE_PASSWORD }}
          AICC_KEY_ALIAS: ${{ secrets.AICC_KEY_ALIAS }}
          AICC_KEY_PASSWORD: ${{ secrets.AICC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk AIControlCenter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIControlCenter-APK
          path: AIControlCenter.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
